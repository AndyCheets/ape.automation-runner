services:
  automation-runner-devcontainer:
    image: mcr.microsoft.com/devcontainers/dotnet:1-9.0
    command: sleep infinity
    volumes:
      - ..:/workspace/ape.automation-runner:cached
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      APE_SERVICE_MODE: "api"
      InternalApi__Enabled: "true"
      InternalApi__ApiKey: dev-key
      RabbitMq__Host: 100.92.86.39
      RabbitMq__VirtualHost: ape_dev
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ape_dev_user
      RabbitMq__Password: replace-with-dev-password
      RabbitMq__ExchangeName: ape.events
